spring:
  application:
    name: RideX
  config:
    # `neon env pull` / `neon deploy` write DATABASE_URL* into .env (or .env.local if .env is missing).
    # Both are gitignored. On a server, set real environment variables instead.
    import: optional:file:.env[.properties],optional:file:.env.local[.properties]

  datasource:
    # Connection URL + credentials come from DATABASE_URL_UNPOOLED, see config/DatabaseConfig.java
    hikari:
      maximum-pool-size: 5        # Neon free tier has a small connection limit
      max-lifetime: 240000        # recycle before Neon drops idle connections (~5 min)
      keepalive-time: 120000
      connection-timeout: 30000   # first query can wake a suspended Neon compute

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 2MB          # driver documents
      max-request-size: 3MB

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 8h                 # a driver's shift
      cookie:
        same-site: lax

ridex:
  time-zone: Asia/Kolkata         # "today" for earnings and revenue
  fare:                           # fare = max(minimum, base + per-km * km + per-min * minutes)
    base: 20
    per-km: 6
    per-min: 0.5
    minimum: 30
    commission-rate: 0.20         # platform share of each paid fare
  dispatch:
    radius-km: 5                  # how far a driver can be from the pickup
    request-timeout-minutes: 3    # unanswered requests expire after this
    location-stale-seconds: 120   # drivers who stopped sending GPS are ignored
  routing:
    osrm-url: https://router.project-osrm.org
    nominatim-url: https://nominatim.openstreetmap.org
    user-agent: RideX-college-project/1.0
    country-codes: in
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
