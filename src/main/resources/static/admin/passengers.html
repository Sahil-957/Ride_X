<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passengers · CabZen Admin</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-nav" class="rx-navbar"></nav>

<main class="container-fluid px-3 px-lg-4 py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
    <div><h1 class="page-title h3 mb-0">Passengers</h1><p class="text-muted mb-0" id="summary">&nbsp;</p></div>
    <input class="form-control" style="max-width: 320px" id="search" type="search" placeholder="Search name, email or phone">
  </div>
  <div class="rx-card">
    <div class="table-responsive">
      <table class="table rx-table">
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Rides</th><th>Joined</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/admin/passengers.js"></script>
</body>
</html>
