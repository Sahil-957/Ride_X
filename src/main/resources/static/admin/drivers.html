<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captains · RideX Admin</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-nav" class="rx-navbar"></nav>

<main class="container-fluid px-3 px-lg-4 py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
    <div><h1 class="page-title h3 mb-0">Captains</h1><p class="text-muted mb-0">Review documents and approve captains before they can go online.</p></div>
    <input class="form-control" style="max-width: 320px" id="search" type="search" placeholder="Search name, phone, licence">
  </div>
  <ul class="nav nav-pills mb-3 gap-1" id="tabs">
    <li class="nav-item"><button class="nav-link active" data-filter="PENDING">Pending</button></li>
    <li class="nav-item"><button class="nav-link" data-filter="APPROVED">Approved</button></li>
    <li class="nav-item"><button class="nav-link" data-filter="REJECTED">Rejected</button></li>
    <li class="nav-item"><button class="nav-link" data-filter="">All</button></li>
  </ul>
  <div class="rx-card">
    <div class="table-responsive">
      <table class="table rx-table">
        <thead><tr><th>Captain</th><th>Phone</th><th>Licence</th><th>Vehicle</th><th>Rating</th><th>Rides</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<div class="modal fade" id="reviewModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-bold" id="reviewTitle">Review captain</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="reviewBody"></div>
      <div class="modal-footer" id="reviewFooter"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/admin/drivers.js"></script>
</body>
</html>
