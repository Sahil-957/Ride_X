<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard · RideX</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-nav" class="rx-navbar"></nav>

<main class="container-fluid px-3 px-lg-4 py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
    <div><h1 class="page-title h3 mb-0">Dashboard</h1><p class="text-muted mb-0">Live overview of RideX. Refreshes automatically.</p></div>
    <span class="small text-muted" id="updatedAt"></span>
  </div>
  <div id="pendingAlert"></div>

  <div class="row g-3 mb-3" id="stats">
    <div class="col-12"><div class="rx-card rx-card-body"><div class="skeleton" style="height: 60px"></div></div></div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-8">
      <div class="rx-card h-100">
        <div class="rx-card-header">Revenue <span class="small text-muted fw-normal">last 14 days</span></div>
        <div class="rx-card-body">
          <div class="d-flex flex-wrap gap-4 mb-2" id="revenueTotals"></div>
          <div id="revenueChart"><div class="skeleton" style="height: 220px"></div></div>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="rx-card h-100">
        <div class="rx-card-header">Bookings by status <span class="small text-muted fw-normal">all time</span></div>
        <div class="rx-card-body" id="statusBreakdown"><div class="skeleton" style="height: 200px"></div></div>
      </div>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-8">
      <div class="rx-card">
        <div class="rx-card-header">Live map
          <span class="small text-muted fw-normal"><i class="bi bi-scooter"></i> online captains · routes = open rides</span></div>
        <div id="liveMap" style="height: 440px; border-radius: 0 0 var(--rx-radius) var(--rx-radius)"></div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="rx-card h-100">
        <div class="rx-card-header">Open &amp; active rides <span id="liveCount" class="rx-badge ACCEPTED">0</span></div>
        <div class="rx-card-body p-0" id="liveList" style="max-height: 440px; overflow-y: auto"></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/map.js"></script>
<script src="/admin/dashboard.js"></script>
</body>
</html>
