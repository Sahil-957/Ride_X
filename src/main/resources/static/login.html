<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · RideX</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-side">
    <a class="rx-brand mb-5 text-decoration-none" href="/"><span class="rx-brand-mark"><i class="bi bi-scooter"></i></span><span>Ride<span class="x">X</span></span></a>
    <h1 class="display-5 fw-bold mb-3">Your city,<br><span style="color: var(--rx-yellow)">minutes away.</span></h1>
    <p class="lead text-white-50 mb-0">Bike taxis that beat the traffic. Book in seconds, pay with cash or UPI, and rate every ride.</p>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <a class="rx-brand d-lg-none mb-4 text-decoration-none" href="/" style="color: var(--rx-ink) !important"><span class="rx-brand-mark"><i class="bi bi-scooter"></i></span><span>Ride<span class="x" style="color: var(--rx-yellow-dark)">X</span></span></a>
      <h2 class="page-title mb-1">Welcome back</h2>
      <p class="text-muted mb-4">Log in as a passenger, captain or admin.</p>
      <div id="notice"></div>

      <form id="loginForm" class="rx-card rx-card-body" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
          <div class="invalid-feedback">Enter your email.</div>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          <div class="invalid-feedback">Enter your password.</div>
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit" data-busy-text="Logging in…">Log in</button>
      </form>

      <p class="text-center mt-4 mb-0">New to RideX?
        <a class="fw-semibold" href="/register.html">Create an account</a> ·
        <a class="fw-semibold" href="/register.html?role=driver">Drive with us</a></p>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
