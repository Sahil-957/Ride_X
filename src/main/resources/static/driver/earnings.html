<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earnings · CabZen Captain</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-nav" class="rx-navbar"></nav>

<main class="container py-4">
  <h1 class="page-title h3 mb-1">Earnings</h1>
  <p class="text-muted mb-3">Your share after the platform commission, from completed rides.</p>

  <div class="row g-3 mb-3" id="cards">
    <div class="col-6 col-lg-3"><div class="rx-card stat-card"><div class="skeleton w-100" style="height: 46px"></div></div></div>
    <div class="col-6 col-lg-3"><div class="rx-card stat-card"><div class="skeleton w-100" style="height: 46px"></div></div></div>
    <div class="col-6 col-lg-3"><div class="rx-card stat-card"><div class="skeleton w-100" style="height: 46px"></div></div></div>
    <div class="col-6 col-lg-3"><div class="rx-card stat-card"><div class="skeleton w-100" style="height: 46px"></div></div></div>
  </div>

  <div class="rx-card mb-3">
    <div class="rx-card-header">Last 7 days</div>
    <div class="rx-card-body" id="chart"><div class="skeleton" style="height: 220px"></div></div>
  </div>

  <div class="rx-card">
    <div class="rx-card-header">Ride history <span class="small text-muted fw-normal">last 50</span></div>
    <div class="table-responsive">
      <table class="table rx-table">
        <thead><tr><th>Date</th><th>Passenger</th><th>Trip</th><th>Fare</th><th>You earned</th><th>Status</th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/driver/earnings.js"></script>
</body>
</html>
