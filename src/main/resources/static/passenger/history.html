<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My rides · RideX</title>
  <link rel="icon" href="/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/app.css" rel="stylesheet">
</head>
<body>
<nav id="app-nav" class="rx-navbar"></nav>

<main class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h1 class="page-title h3 mb-0">My rides</h1>
      <p class="text-muted mb-0">Your last 50 bookings.</p>
    </div>
    <a class="btn btn-primary" href="/passenger/home.html"><i class="bi bi-plus-lg me-1"></i>Book a ride</a>
  </div>
  <div id="rides" class="row g-3">
    <div class="col-12"><div class="rx-card rx-card-body"><div class="skeleton mb-2" style="height: 20px"></div><div class="skeleton" style="height: 20px; width: 60%"></div></div></div>
  </div>
</main>

<div class="modal fade" id="rateModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rx-card">
      <div class="modal-header border-0"><h5 class="modal-title fw-bold">Rate your ride</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p class="text-muted mb-2" id="rateWho"></p>
        <div class="star-input text-center mb-3" id="rateStars"></div>
        <textarea class="form-control" id="rateComment" rows="3" maxlength="500" placeholder="Anything to add? (optional)"></textarea>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-dark w-100" id="rateSubmit" data-busy-text="Sending…" disabled>Submit rating</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/passenger/history.js"></script>
</body>
</html>
